<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Grammar sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Schibsted+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--cotton:#F5F5F3;--nylon:#0B0B0C;--orange:#FF5A1F}
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:var(--cotton);color:var(--nylon);font-family:'Schibsted Grotesk',sans-serif}
  nav{height:84px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;border-bottom:2px solid var(--nylon);font-family:'Archivo Narrow';text-transform:uppercase;font-size:18px}
  nav a{color:var(--nylon);text-decoration:none}
  .tag{position:absolute;right:120px;top:84px;width:4px;height:120px;background:var(--nylon)}
  .tag i{position:absolute;left:-38px;top:118px;width:80px;height:140px;background:var(--orange);transform:rotate(8deg);font-style:normal;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;font-family:'Archivo Narrow';font-size:16px;color:var(--nylon)}
  h1{margin:90px 56px 0;font-family:'Archivo Narrow';font-weight:700;font-size:168px;line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
  p{margin:36px 56px 0;width:460px;font-size:18px;line-height:1.5}
  .stripe{position:absolute;left:0;right:0;top:760px;height:56px;background:repeating-linear-gradient(45deg,var(--nylon) 0 22px,var(--cotton) 22px 44px)}
  .cta{position:absolute;left:56px;top:740px;background:var(--orange);padding:30px 34px;font-family:'Archivo Narrow';font-size:22px;text-transform:uppercase;color:var(--nylon);text-decoration:none}
</style></head><body>
<nav><span>"RQ Systems"</span><a href="#">"Contact us"</a></nav>
<div class="tag"><i>"CONTACT"</i></div>
<h1>"Your operations,<br>automated."</h1>
<p>Built by two engineers from Técnico. We find what's still manual in your operations and build tailored software to automate it.</p>
<div class="stripe"></div>
<a class="cta" href="#">"Contact us"</a>
</body></html>
