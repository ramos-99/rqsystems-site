<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero C · Cables</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  .hero { position: relative; min-height: 100svh; overflow: hidden; }
  .art { inset: -3%; }
  .art img { object-position: 50% 30%; }
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--night) 4%, rgb(5 6 10 / 0.72) 38%, rgb(5 6 10 / 0.15) 70%), linear-gradient(90deg, rgb(5 6 10 / 0.7), transparent 55%); }
  .copy { position: absolute; z-index: 2; left: clamp(1.25rem, 4vw, 3.5rem); right: clamp(1.25rem, 4vw, 3.5rem); bottom: clamp(2rem, 7svh, 4.5rem); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2rem 4rem; }
  .copy h1 { grid-column: 1 / -1; }
  .actions { display: flex; gap: 0.75rem; }
  @media (max-width: 40rem) {
    .copy { grid-template-columns: 1fr; }
    .art img { object-position: 78% 30%; }
  }
</style></head>
<body>
<header class="bar">
  <a class="brand" href="#"><img src="logo.svg" alt="">Systems</a>
  <div class="bar-end"><nav class="lang"><a aria-current="true" href="#">EN</a><a href="#">PT</a></nav><a class="pill pill-lime pill-sm" href="#">Contact us</a></div>
</header>
<main class="hero">
  <div class="art"><img src="cables.webp" alt="" width="2000" height="1333"></div>
  <div class="copy">
    <h1 class="rise">Your operations, <span class="lime">automated.</span></h1>
    <p class="lead rise">Built by two engineers from Técnico. We find what's still manual in your operations and build tailored software to automate it.</p>
    <div class="actions rise">
      <a class="pill pill-lime" href="#">Contact us <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 7h11M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
      <a class="pill pill-line" href="#">What we build</a>
    </div>
  </div>
</main>
<script>
  addEventListener('pointermove', (e) => { document.documentElement.style.setProperty('--mx', (e.clientX / innerWidth - 0.5).toFixed(3)); document.documentElement.style.setProperty('--my', (e.clientY / innerHeight - 0.5).toFixed(3)) }, { passive: true })
</script>
</body></html>
